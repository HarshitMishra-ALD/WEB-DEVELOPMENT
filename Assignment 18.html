<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC College Admission 2026</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #000000;
    }

    header, footer {
      background-color: #162683;
      color: #ffffff;
      text-align: center;
    }

    header {
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    main {
      max-width: 650px;
      margin: 20px auto;
      padding: 0 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    caption {
      margin-bottom: 5px;
    }

    th, td {
      border: 1px solid #999999;
      padding: 8px 10px;
      text-align: left;
    }

    th {
      background-color: #e6e9f2;
      text-align: center;
    }

    fieldset {
      border: 1px solid #999999;
      padding: 15px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="email"] {
      width: 280px;
      padding: 4px;
    }

    textarea {
      width: 85%;
      height: 55px;
      padding: 4px;
    }

    footer {
      padding: 10px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>ABC College Admission 2026</h1>
  </header>

  <main>
    <section aria-labelledby="courses-heading">
      <h2 id="courses-heading">Courses and Fees</h2>

      <table>
        <caption>Available Courses</caption>
        <thead>
          <tr>
            <th scope="col">Course</th>
            <th scope="col">Seats</th>
            <th scope="col">Fees</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>&#8377;90,000</td>
          </tr>
          <tr>
            <td>BCA</td>
            <td>60</td>
            <td>&#8377;45,000</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section aria-label="Student Admission Form">
      <form action="#" method="POST">
        <fieldset>
          <legend>Application Form</legend>

          <div class="form-group">
            <label for="student-name">Name:</label>
            <input type="text" id="student-name" name="name" required>
          </div>

          <div class="form-group">
            <label for="student-email">Email:</label>
            <input type="email" id="student-email" name="email" required>
          </div>

          <div class="form-group">
            <label for="course-select">Course:</label>
            <select id="course-select" name="course" required>
              <option value="btech-cse" selected>B.Tech CSE</option>
              <option value="bca">BCA</option>
            </select>
          </div>

          <div class="form-group">
            <label for="statement">Statement:</label>
            <textarea id="statement" name="statement" minlength="10" required></textarea>
          </div>

          <button type="submit">Apply</button>
        </fieldset>
      </form>
    </section>
  </main>

  <footer>
    &copy; 2026 ABC College
  </footer>

</body>
</html>
